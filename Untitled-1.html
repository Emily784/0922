<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>校園生態調查資料登錄</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            emerald: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 防止流動與彈性滾動效果優化 */
    body {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="h-full text-slate-800 flex flex-col justify-between antialiased selection:bg-emerald-500 selection:text-white">

  <!-- 頂部導覽列 -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-md mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-full bg-emerald-600/80 border border-emerald-400/40 flex items-center justify-center text-emerald-100 shadow-inner">
          <i class="fa-solid font-bold fa-leaf text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-wide">校園生態調查</h1>
          <p class="text-[11px] text-emerald-200 font-medium tracking-wider">ECO-SURVEY DATA COLLECTION</p>
        </div>
      </div>
      <button type="button" onclick="toggleSettingsModal()" class="p-2 text-emerald-100 hover:text-white hover:bg-emerald-600/50 rounded-full transition-colors" title="設定 Apps Script URL">
        <i class="fa-solid fa-gear text-lg"></i>
      </button>
    </div>
  </header>

  <!-- 主要內容區塊 -->
  <main class="flex-grow max-w-md w-full mx-auto px-4 py-5 space-y-4">

    <!-- GPS 定位狀態卡片 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 transition-all duration-300 hover:shadow-md">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center space-x-2 text-slate-700 font-semibold text-sm">
          <i class="fa-solid fa-location-dot text-emerald-600"></i>
          <span>GPS 當前定位</span>
        </div>
        <button type="button" onclick="startGeolocation()" class="text-xs font-medium text-emerald-600 hover:text-emerald-700 hover:bg-emerald-50 px-2.5 py-1 rounded-lg transition flex items-center space-x-1 border border-emerald-200/60">
          <i id="gpsRefreshIcon" class="fa-solid fa-rotate-right"></i>
          <span>重新定位</span>
        </button>
      </div>

      <!-- 定位狀態顯示內容 -->
      <div id="gpsStatusContainer" class="flex items-center space-x-3 p-3 bg-slate-50 rounded-xl border border-slate-100">
        <div id="gpsIndicator" class="w-3 h-3 rounded-full bg-amber-400 animate-pulse flex-shrink-0"></div>
        <div class="flex-1 min-w-0">
          <p id="gpsStatusText" class="text-xs font-medium text-slate-600 truncate">正在獲取 GPS 座標...</p>
          <p id="gpsCoordsText" class="text-xs font-mono font-semibold text-slate-800 hidden mt-0.5"></p>
        </div>
      </div>
    </div>

    <!-- 調查資料輸入表單 -->
    <form id="surveyForm" onsubmit="handleFormSubmit(event)" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 space-y-4">
      
      <!-- 1. 校園地點 -->
      <div>
        <label for="locationInput" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
          校園地點 <span class="text-rose-500">*</span>
        </label>
        <div class="relative rounded-xl shadow-sm">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-map-pin text-sm"></i>
          </div>
          <input type="text" id="locationInput" required list="locationSuggestions" placeholder="例如：圖書館前草皮、生態池"
            class="block w-full pl-10 pr-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:border-transparent transition-all">
          <datalist id="locationSuggestions">
            <option value="行政大樓前廣場"></option>
            <option value="生態景觀池"></option>
            <option value="圖書館側邊草皮"></option>
            <option value="體育館旁林道"></option>
            <option value="教學大樓中庭"></option>
          </datalist>
        </div>
      </div>

      <!-- 2. 物種名稱 -->
      <div>
        <label for="speciesInput" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
          物種名稱 <span class="text-rose-500">*</span>
        </label>
        <div class="relative rounded-xl shadow-sm">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-crow text-sm"></i>
          </div>
          <input type="text" id="speciesInput" required placeholder="例如：喜鵲、大白鷺、榕樹"
            class="block w-full pl-10 pr-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:border-transparent transition-all">
        </div>
      </div>

      <!-- 3. 數量與單位 (組合欄位) -->
      <div class="grid grid-cols-5 gap-2.5">
        <div class="col-span-3">
          <label for="quantityInput" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
            數量 <span class="text-rose-500">*</span>
          </label>
          <div class="relative rounded-xl shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-hashtag text-sm"></i>
            </div>
            <input type="number" id="quantityInput" required min="1" step="any" placeholder="1"
              class="block w-full pl-10 pr-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:border-transparent transition-all">
          </div>
        </div>

        <div class="col-span-2">
          <label for="unitInput" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
            單位 <span class="text-rose-500">*</span>
          </label>
          <select id="unitInput" class="block w-full px-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:border-transparent transition-all text-slate-700 font-medium">
            <option value="隻" selected>隻</option>
            <option value="棵">棵</option>
            <option value="株">株</option>
            <option value="個">個</option>
            <option value="群">群</option>
            <option value="朵">朵</option>
          </select>
        </div>
      </div>

      <!-- 4. 備註 (選填) -->
      <div>
        <label for="noteInput" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
          備註說明 <span class="text-slate-400 text-[10px] lowercase font-normal">(選填)</span>
        </label>
        <div class="relative rounded-xl shadow-sm">
          <textarea id="noteInput" rows="2" placeholder="如：棲息行為、幼鳥、開花中..."
            class="block w-full p-3 bg-slate-50/50 border border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:border-transparent transition-all resize-none"></textarea>
        </div>
      </div>

      <!-- 提示文字 -->
      <p class="text-[11px] text-slate-400 flex items-center space-x-1 pt-1">
        <i class="fa-solid fa-circle-info"></i>
        <span>送出時將自動附加當下的日期時間與 GPS 座標。</span>
      </p>

      <!-- 送出按鈕 -->
      <button type="submit" id="submitBtn"
        class="w-full mt-2 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold py-3 px-4 rounded-xl shadow-md shadow-emerald-600/20 transition-all duration-200 flex items-center justify-center space-x-2 group">
        <i class="fa-solid fa-paper-plane text-sm group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
        <span id="submitBtnText" class="tracking-wider">提交送出 (Submit)</span>
      </button>
    </form>

    <!-- Apps Script URL 設定提詞卡片 (若未設定時提示) -->
    <div id="urlWarningCard" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-4 flex items-start space-x-3 text-amber-800">
      <i class="fa-solid fa-triangle-exclamation text-amber-500 text-lg mt-0.5"></i>
      <div class="flex-1 text-xs space-y-1">
        <p class="font-bold text-amber-900">尚未設定 Apps Script 網址</p>
        <p class="text-amber-700 leading-relaxed">請點擊右上角⚙️圖示設定您的 Apps Script Web App URL，以利寫入資料至 Google 試算表。</p>
        <button type="button" onclick="toggleSettingsModal()" class="font-bold underline text-amber-900 hover:text-amber-950">立即設定</button>
      </div>
    </div>

  </main>

  <!-- 頁腳 -->
  <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200/60 bg-white">
    <p>校園生態調查資料庫整合工具 &copy; 2026</p>
  </footer>

  <!-- Apps Script URL 設定 Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl space-y-4 transform scale-95 transition-transform duration-200" id="settingsModalCard">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-800 flex items-center space-x-2">
          <i class="fa-solid fa-gear text-emerald-600"></i>
          <span>後端設定</span>
        </h3>
        <button type="button" onclick="toggleSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      
      <div class="space-y-2">
        <label for="gasUrlInput" class="block text-xs font-semibold text-slate-700">
          Google Apps Script Web App URL
        </label>
        <textarea id="gasUrlInput" rows="3" placeholder="https://script.google.com/macros/s/.../exec"
          class="w-full p-2.5 text-xs font-mono bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none leading-relaxed"></textarea>
        <p class="text-[11px] text-slate-400">設定將自動儲存於此裝置的瀏覽器（localStorage）。</p>
      </div>

      <div class="flex space-x-2 pt-2">
        <button type="button" onclick="toggleSettingsModal()" class="flex-1 py-2 px-3 border border-slate-200 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-50">
          取消
        </button>
        <button type="button" onclick="saveGasUrl()" class="flex-1 py-2 px-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold shadow-sm">
          儲存設定
        </button>
      </div>
    </div>
  </div>

  <!-- 送出結果 Toast / Modal 提示 -->
  <div id="statusToast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-sm hidden transition-all duration-300">
    <div id="statusToastContent" class="p-4 rounded-2xl shadow-xl border flex items-start space-x-3">
      <div id="toastIcon" class="text-xl mt-0.5"></div>
      <div class="flex-1 min-w-0">
        <p id="toastTitle" class="font-bold text-sm"></p>
        <p id="toastMessage" class="text-xs mt-0.5 leading-relaxed opacity-90"></p>
      </div>
      <button type="button" onclick="hideToast()" class="text-slate-400 hover:text-slate-600">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <script>
    // 全域變數管理 GPS 狀態
    let currentGpsCoords = {
      lat: null,
      lng: null,
      formatted: '未獲取 GPS'
    };

    // 頁面載入完成後的初始化邏輯
    window.addEventListener('DOMContentLoaded', () => {
      // 1. 載入已儲存的 Apps Script URL
      loadGasUrl();

      // 2. 自動啟動手機 GPS 定位
      startGeolocation();
    });

    // --- 1. GPS 定位邏輯 ---
    function startGeolocation() {
      const statusText = document.getElementById('gpsStatusText');
      const coordsText = document.getElementById('gpsCoordsText');
      const indicator = document.getElementById('gpsIndicator');
      const refreshIcon = document.getElementById('gpsRefreshIcon');

      // 動畫效果
      refreshIcon.classList.add('fa-spin');
      indicator.className = "w-3 h-3 rounded-full bg-amber-400 animate-pulse flex-shrink-0";
      statusText.innerText = "正在獲取 GPS 定位...";
      coordsText.classList.add('hidden');

      if (!("geolocation" in navigator)) {
        updateGpsUI(false, "您的裝置不支援 GPS 定位");
        refreshIcon.classList.remove('fa-spin');
        return;
      }

      const options = {
        enableHighAccuracy: true, // 啟用高精確度定位
        timeout: 10000,           // 超時 10 秒
        maximumAge: 0             // 不使用快取
      };

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude.toFixed(5);
          const lng = position.coords.longitude.toFixed(5);
          currentGpsCoords = {
            lat: lat,
            lng: lng,
            formatted: `${lat}, ${lng}`
          };
          updateGpsUI(true, `定位成功 (${lat}, ${lng})`, currentGpsCoords.formatted);
          refreshIcon.classList.remove('fa-spin');
        },
        (error) => {
          let errorMsg = "定位失敗，請確認權限";
          switch (error.code) {
            case error.PERMISSION_DENIED:
              errorMsg = "存取失敗：使用者拒絕提供位置權限";
              break;
            case error.POSITION_UNAVAILABLE:
              errorMsg = "定位失敗：無法取得位置資訊";
              break;
            case error.TIMEOUT:
              errorMsg = "定位失敗：定位請求逾時";
              break;
          }
          currentGpsCoords.formatted = "無 GPS 紀錄";
          updateGpsUI(false, errorMsg);
          refreshIcon.classList.remove('fa-spin');
        },
        options
      );
    }

    function updateGpsUI(isSuccess, statusMsg, coordsMsg = '') {
      const statusText = document.getElementById('gpsStatusText');
      const coordsText = document.getElementById('gpsCoordsText');
      const indicator = document.getElementById('gpsIndicator');

      statusText.innerText = statusMsg;

      if (isSuccess) {
        indicator.className = "w-3 h-3 rounded-full bg-emerald-500 flex-shrink-0";
        coordsText.innerText = `座標: ${coordsMsg}`;
        coordsText.classList.remove('hidden');
      } else {
        indicator.className = "w-3 h-3 rounded-full bg-rose-500 flex-shrink-0";
        coordsText.classList.add('hidden');
      }
    }

    // --- 2. 時間格式化工具（YYYY-MM-DD HH:mm:ss）---
    function getCurrentFormattedDateTime() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }

    // --- 3. 表單提交處理 ---
    async function handleFormSubmit(event) {
      event.preventDefault();

      const gasUrl = localStorage.getItem('ecosurvey_gas_url') || '';
      if (!gasUrl) {
        showToast('請先設定 Apps Script URL', '請點擊右上角⚙️按鈕輸入您的 Apps Script Web App 部署網址。', 'warning');
        toggleSettingsModal();
        return;
      }

      // 取得使用者輸入
      const location = document.getElementById('locationInput').value.trim();
      const species = document.getElementById('speciesInput').value.trim();
      const quantity = document.getElementById('quantityInput').value.trim();
      const unit = document.getElementById('unitInput').value;
      const note = document.getElementById('noteInput').value.trim();

      // **點擊瞬間自動捕捉日期時間**
      const currentDatetime = getCurrentFormattedDateTime();

      // 封裝 Payload 資料
      const payload = {
        datetime: currentDatetime,
        location: location,
        gps: currentGpsCoords.formatted,
        species: species,
        quantity: quantity,
        unit: unit,
        note: note
      };

      // 切換按鈕 UI 為載入狀態
      setSubmitLoading(true);

      try {
        // 發送 POST 請求至 GAS
        const response = await fetch(gasUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8' // 避免觸發 Preflight CORS 限制
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
          showToast('資料上傳成功！', `已寫入試算表 (${species} × ${quantity}${unit})`, 'success');
          
          // 清空使用者輸入欄位 (保留 GAS URL 與當前 GPS)
          document.getElementById('speciesInput').value = '';
          document.getElementById('quantityInput').value = '';
          document.getElementById('noteInput').value = '';
        } else {
          showToast('寫入失敗', result.message || '後端回傳錯誤，請檢查試算表與 GAS 代碼。', 'error');
        }
      } catch (err) {
        showToast('網路傳輸失敗', `無法發送請求，請確認網址或網路連線狀態。\n(${err.message})`, 'error');
      } finally {
        setSubmitLoading(false);
      }
    }

    function setSubmitLoading(isLoading) {
      const submitBtn = document.getElementById('submitBtn');
      const submitBtnText = document.getElementById('submitBtnText');

      if (isLoading) {
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
        submitBtnText.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 資料上傳中...`;
      } else {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
        submitBtnText.innerHTML = `提交送出 (Submit)`;
      }
    }

    // --- 4. Modal 與 URL 設定邏輯 ---
    function toggleSettingsModal() {
      const modal = document.getElementById('settingsModal');
      const modalCard = document.getElementById('settingsModalCard');

      if (modal.classList.contains('hidden')) {
        modal.classList.remove('hidden');
        setTimeout(() => {
          modal.classList.remove('opacity-0');
          modalCard.classList.remove('scale-95');
          modalCard.classList.add('scale-100');
        }, 10);
      } else {
        modal.classList.add('opacity-0');
        modalCard.classList.remove('scale-100');
        modalCard.classList.add('scale-95');
        setTimeout(() => {
          modal.classList.add('hidden');
        }, 200);
      }
    }

    function loadGasUrl() {
      const savedUrl = localStorage.getItem('ecosurvey_gas_url') || '';
      document.getElementById('gasUrlInput').value = savedUrl;

      const warningCard = document.getElementById('urlWarningCard');
      if (!savedUrl) {
        warningCard.classList.remove('hidden');
      } else {
        warningCard.classList.add('hidden');
      }
    }

    function saveGasUrl() {
      const urlInput = document.getElementById('gasUrlInput').value.trim();
      localStorage.setItem('ecosurvey_gas_url', urlInput);
      loadGasUrl();
      toggleSettingsModal();
      showToast('設定已儲存', 'Apps Script URL 已成功更新。', 'info');
    }

    // --- 5. Toast 訊息提示元件 ---
    function showToast(title, message, type = 'info') {
      const toast = document.getElementById('statusToast');
      const toastContent = document.getElementById('statusToastContent');
      const toastIcon = document.getElementById('toastIcon');
      const toastTitle = document.getElementById('toastTitle');
      const toastMessage = document.getElementById('toastMessage');

      toastTitle.innerText = title;
      toastMessage.innerText = message;

      // 樣式切換
      if (type === 'success') {
        toastContent.className = "p-4 rounded-2xl shadow-xl border bg-emerald-900 text-white border-emerald-700";
        toastIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-300"></i>`;
      } else if (type === 'error') {
        toastContent.className = "p-4 rounded-2xl shadow-xl border bg-rose-900 text-white border-rose-700";
        toastIcon.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-300"></i>`;
      } else if (type === 'warning') {
        toastContent.className = "p-4 rounded-2xl shadow-xl border bg-amber-900 text-white border-amber-700";
        toastIcon.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-300"></i>`;
      } else {
        toastContent.className = "p-4 rounded-2xl shadow-xl border bg-slate-800 text-white border-slate-700";
        toastIcon.innerHTML = `<i class="fa-solid fa-circle-info text-blue-300"></i>`;
      }

      toast.classList.remove('hidden');

      // 4 秒後自動關閉
      setTimeout(() => {
        hideToast();
      }, 4000);
    }

    function hideToast() {
      const toast = document.getElementById('statusToast');
      toast.classList.add('hidden');
    }
  </script>
</body>
</html>
